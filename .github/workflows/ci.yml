name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

# A new push to the same PR cancels the run that is still testing the old head.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # The job name is the status check that the `main` ruleset requires before a
    # PR can be merged. Renaming it means updating the ruleset too.
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: package.json
                  cache: npm

            # Tests run in Node (see vitest.config.mts), so the Electron binary is
            # not needed.
            - run: npm ci
              env:
                  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

            - run: npm test
