name: Release

on:
  push:
    tags:
      - 'v*'            # e.g. git tag v1.2.0 && git push origin v1.2.0
  workflow_dispatch:    # lets you run it manually from the Actions tab

# GITHUB_TOKEN needs write access to contents to create releases and upload assets
permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only needed if your Linux makers include deb/rpm
      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg

      - name: Install dependencies
        run: npm ci

      - name: Publish
        run: npm run publish   # "publish": "electron-forge publish" in package.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}